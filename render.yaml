services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: interview-accelerator-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: interview-accelerator-db
          property: connectionString

  # 2. React Vite Frontend Static Site
  - type: web
    name: interview-accelerator-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: interview-accelerator-backend
          envVarKey: RENDER_EXTERNAL_URL
          transform: "${RENDER_EXTERNAL_URL}/api"

databases:
  # 3. Managed Cloud PostgreSQL Database (Free Tier)
  - name: interview-accelerator-db
    databaseName: interview_db
    user: interview_user
    plan: free
